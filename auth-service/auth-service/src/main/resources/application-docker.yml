server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE

  datasource:
    url: jdbc:mysql://mysql:3306/auth_db
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"

clients:
  notification:
    connect-timeout-ms: ${NOTIFICATION_CONNECT_TIMEOUT_MS:2000}
    # Allow SMTP connection/read/write waits (10s each) plus response overhead.
    read-timeout-ms: ${NOTIFICATION_READ_TIMEOUT_MS:35000}

app:
  bootstrap:
    owner:
      enabled: ${BOOTSTRAP_OWNER_ENABLED:false}
      name: ${BOOTSTRAP_OWNER_NAME:}
      email: ${BOOTSTRAP_OWNER_EMAIL:}
      password: ${BOOTSTRAP_OWNER_PASSWORD:}
  invitation:
    frontend-base-url: ${FRONTEND_BASE_URL}

security:
  login-rate-limit:
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
    max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
    window: ${LOGIN_RATE_LIMIT_WINDOW:PT5M}
    max-entries: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}
  jwt:
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    key-id: ${JWT_KEY_ID}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
