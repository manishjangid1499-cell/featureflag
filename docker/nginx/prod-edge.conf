# Edge reverse proxy configuration for Feature Flag Platform
# Terminates TLS (HTTPS 443) and redirects HTTP (80) to HTTPS.
# Authoritatively overwrites all forwarding headers to prevent header spoofing.

log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP: Port 80 (ACME renewal challenge + HTTPS redirect)
server {
    listen 80;
    listen [::]:80;
    server_name featureflags.duckdns.org;
    server_tokens off;

    access_log /dev/stdout no_query;
    error_log /dev/stderr warn;

    # ACME challenge directory for Certbot webroot validation / renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://featureflags.duckdns.org$request_uri;
    }
}

# HTTPS: Port 443 (Production Edge with TLS Termination)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name featureflags.duckdns.org;
    server_tokens off;

    access_log /dev/stdout no_query;
    error_log /dev/stderr warn;

    # TLS Certificate and Private Key mounted via /etc/letsencrypt directory tree
    ssl_certificate /etc/letsencrypt/live/featureflags.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/featureflags.duckdns.org/privkey.pem;

    # Modern TLS protocols and cipher suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HTTP Strict Transport Security & security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Client payload limit
    client_max_body_size 10m;

    # Proxy all traffic to the internal frontend Nginx container
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;

        # Authoritatively enforce HTTPS scheme and client IP; overwrite untrusted client headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
