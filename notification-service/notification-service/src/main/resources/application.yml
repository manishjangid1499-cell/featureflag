spring:
  profiles:
    active: local

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

app:
  notification:
    delivery:
      enabled: true
      max-attempts: 5
      initial-delay: 30s
      multiplier: 2
      max-delay: 15m
      batch-size: 25
      lease-duration: 2m
      poll-interval: 5s
