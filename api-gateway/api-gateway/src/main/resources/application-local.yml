server:
  port: 8080

spring:
  application:
    name: GATEWAY-SERVICE

  cloud:
    gateway:
      server:
        webflux:

          # ==========================================
          # GLOBAL CORS CONFIGURATION
          # ==========================================
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "*"
                allowCredentials: false
                maxAge: 3600

          # ==========================================
          # ROUTES
          # ==========================================
          routes:

            # ==========================================
            # AUTH SERVICE & MEMBERS
            # ==========================================

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**, /members/**, /test/**

            - id: auth-service-openapi
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - RewritePath=/auth/v3/api-docs, /v3/api-docs


            # ==========================================
            # FLAG SERVICE
            # ==========================================

            - id: flag-service
              uri: lb://FLAG-SERVICE
              predicates:
                - Path=/flags/**

            - id: flag-service-openapi
              uri: lb://FLAG-SERVICE
              predicates:
                - Path=/flags/v3/api-docs
              filters:
                - RewritePath=/flags/v3/api-docs, /v3/api-docs


            # ==========================================
            # ANALYTICS SERVICE
            # ==========================================

            - id: analytics-service
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/analytics/**

            - id: analytics-service-openapi
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/analytics/v3/api-docs
              filters:
                - RewritePath=/analytics/v3/api-docs, /v3/api-docs


            # ==========================================
            # NOTIFICATION SERVICE
            # ==========================================

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: notification-service-openapi
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - RewritePath=/notification/v3/api-docs, /v3/api-docs


            # ==========================================
            # AUDIT SERVICE
            # ==========================================

            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/audit/**

            - id: audit-service-openapi
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/audit/v3/api-docs
              filters:
                - RewritePath=/audit/v3/api-docs, /v3/api-docs


# ==========================================
# EUREKA
# ==========================================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


# ==========================================
# SWAGGER / SPRINGDOC
# ==========================================

springdoc:
  swagger-ui:
    path: /swagger-ui.html

    urls:
      - name: Auth Service
        url: /auth/v3/api-docs

      - name: Flag Service
        url: /flags/v3/api-docs

      - name: Analytics Service
        url: /analytics/v3/api-docs

      - name: Notification Service
        url: /notification/v3/api-docs

      - name: Audit Service
        url: /audit/v3/api-docs