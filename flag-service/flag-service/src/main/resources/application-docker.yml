server:
  port: 8082

spring:
  application:
    name: FLAG-SERVICE

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092


  datasource:
    url: jdbc:mysql://mysql:3306/flag_db
    username: ${FLAG_DB_USERNAME}
    password: ${FLAG_DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"

clients:
  auth-recipients:
    connect-timeout-ms: ${AUTH_RECIPIENTS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AUTH_RECIPIENTS_READ_TIMEOUT_MS:3000}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

outbox:
  retention:
    published-age: ${OUTBOX_PUBLISHED_RETENTION:PT168H}
    batch-size: ${OUTBOX_RETENTION_BATCH_SIZE:100}
    initial-delay-ms: ${OUTBOX_RETENTION_INITIAL_DELAY_MS:60000}
    cleanup-interval-ms: ${OUTBOX_RETENTION_INTERVAL_MS:3600000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
