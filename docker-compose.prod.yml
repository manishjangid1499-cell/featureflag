# Production Docker Compose for Feature Flag Platform
# Target: Ubuntu 24.04 ARM64 (1 OCPU / 1 core, 7 GB RAM)
# Domain: featureflags.duckdns.org (Public IP: 168.138.115.124)

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  edge-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./docker/nginx/prod-edge.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: "${LETSENCRYPT_DIR:-/etc/letsencrypt}"
        target: /etc/letsencrypt
        read_only: true
      - type: bind
        source: "${ACME_WEBROOT_DIR:-./acme-challenge}"
        target: /var/www/certbot
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    mem_limit: 64m
    logging: *default-logging

  frontend:
    image: feature-flag-frontend:latest
    restart: unless-stopped
    build:
      context: ./Frontend/feature-flag-ui
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./docker/nginx/prod-frontend.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "-T", "4", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    mem_limit: 64m
    logging: *default-logging

  api-gateway:
    image: api-gateway:latest
    restart: unless-stopped
    build:
      context: ./api-gateway/api-gateway
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -XX:MaxMetaspaceSize=128m"
      CORS_ALLOWED_ORIGINS: &browser_origins "${CORS_ALLOWED_ORIGINS:-https://featureflags.duckdns.org}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      auth-service:
        condition: service_healthy
      flag-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 550M
    mem_limit: 550m
    logging: *default-logging

  auth-service:
    image: auth-service:latest
    restart: unless-stopped
    build:
      context: ./auth-service/auth-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -XX:MaxMetaspaceSize=128m"
      AUTH_DB_USERNAME: "${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}"
      AUTH_JWT_PRIVATE_KEY_LOCATION: "file:/run/secrets/jwt-private.pem"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-15m}"
      JWT_KEY_ID: "${JWT_KEY_ID:?JWT_KEY_ID is required}"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      AUTH_INTERNAL_SERVICE_KEY: "${AUTH_INTERNAL_SERVICE_KEY:-${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}}"
      NOTIFICATION_INTERNAL_SERVICE_KEY: "${NOTIFICATION_INTERNAL_SERVICE_KEY:?NOTIFICATION_INTERNAL_SERVICE_KEY is required}"
      BOOTSTRAP_OWNER_ENABLED: "${BOOTSTRAP_OWNER_ENABLED:-false}"
      BOOTSTRAP_OWNER_NAME: "${BOOTSTRAP_OWNER_NAME:-}"
      BOOTSTRAP_OWNER_EMAIL: "${BOOTSTRAP_OWNER_EMAIL:-}"
      BOOTSTRAP_OWNER_PASSWORD: "${BOOTSTRAP_OWNER_PASSWORD:-}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-https://featureflags.duckdns.org}"
    volumes:
      - type: bind
        source: "${AUTH_JWT_PRIVATE_KEY_FILE:?AUTH_JWT_PRIVATE_KEY_FILE is required}"
        target: /run/secrets/jwt-private.pem
        read_only: true
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 550M
    mem_limit: 550m
    logging: *default-logging

  flag-service:
    image: flag-service:latest
    restart: unless-stopped
    build:
      context: ./flag-service/flag-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms320m -Xmx320m -XX:MaxMetaspaceSize=192m"
      FLAG_DB_USERNAME: "${FLAG_DB_USERNAME:?FLAG_DB_USERNAME is required}"
      FLAG_DB_PASSWORD: "${FLAG_DB_PASSWORD:?FLAG_DB_PASSWORD is required}"
      CORS_ALLOWED_ORIGINS: *browser_origins
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-500ms}"
      REDIS_COMMAND_TIMEOUT: "${REDIS_COMMAND_TIMEOUT:-500ms}"
      KAFKA_MAX_BLOCK_MS: "${KAFKA_MAX_BLOCK_MS:-1000}"
      EVALUATION_TELEMETRY_QUEUE_CAPACITY: "${EVALUATION_TELEMETRY_QUEUE_CAPACITY:-256}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      AUTH_INTERNAL_SERVICE_KEY: "${AUTH_INTERNAL_SERVICE_KEY:-${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 650M
    mem_limit: 650m
    logging: *default-logging

  audit-service:
    image: audit-service:latest
    restart: unless-stopped
    build:
      context: ./audit-service/audit-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms200m -Xmx200m -XX:MaxMetaspaceSize=192m"
      AUDIT_DB_USERNAME: "${AUDIT_DB_USERNAME:?AUDIT_DB_USERNAME is required}"
      AUDIT_DB_PASSWORD: "${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}"
      CORS_ALLOWED_ORIGINS: *browser_origins
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      AUTH_INTERNAL_SERVICE_KEY: "${AUTH_INTERNAL_SERVICE_KEY:-${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    mem_limit: 600m
    logging: *default-logging

  analytics-service:
    image: analytics-service:latest
    restart: unless-stopped
    build:
      context: ./analytics-service/analytics-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms200m -Xmx200m -XX:MaxMetaspaceSize=192m"
      ANALYTICS_DB_USERNAME: "${ANALYTICS_DB_USERNAME:?ANALYTICS_DB_USERNAME is required}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      AUTH_INTERNAL_SERVICE_KEY: "${AUTH_INTERNAL_SERVICE_KEY:-${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    mem_limit: 600m
    logging: *default-logging

  notification-service:
    image: notification-service:latest
    restart: unless-stopped
    build:
      context: ./notification-service/notification-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms200m -Xmx200m -XX:MaxMetaspaceSize=192m"
      NOTIFICATION_DB_USERNAME: "${NOTIFICATION_DB_USERNAME:?NOTIFICATION_DB_USERNAME is required}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}"
      NOTIFICATION_MAIL_USERNAME: "${NOTIFICATION_MAIL_USERNAME:?NOTIFICATION_MAIL_USERNAME is required}"
      NOTIFICATION_MAIL_PASSWORD: "${NOTIFICATION_MAIL_PASSWORD:?NOTIFICATION_MAIL_PASSWORD is required}"
      NOTIFICATION_MAIL_CONNECTION_TIMEOUT_MS: "${NOTIFICATION_MAIL_CONNECTION_TIMEOUT_MS:-10000}"
      NOTIFICATION_MAIL_READ_TIMEOUT_MS: "${NOTIFICATION_MAIL_READ_TIMEOUT_MS:-10000}"
      NOTIFICATION_MAIL_WRITE_TIMEOUT_MS: "${NOTIFICATION_MAIL_WRITE_TIMEOUT_MS:-10000}"
      NOTIFICATION_INTERNAL_SERVICE_KEY: "${NOTIFICATION_INTERNAL_SERVICE_KEY:?NOTIFICATION_INTERNAL_SERVICE_KEY is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      AUTH_INTERNAL_SERVICE_KEY: "${AUTH_INTERNAL_SERVICE_KEY:-${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    mem_limit: 600m
    logging: *default-logging

  eureka-server:
    image: eureka-server:latest
    restart: unless-stopped
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:MaxMetaspaceSize=96m"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
    mem_limit: 384m
    logging: *default-logging

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx64m"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        export KAFKA_HEAP_OPTS="-Xms64m -Xmx64m"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-evaluations --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events-audit-dlt --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events-analytics-dlt --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events-dlt --partitions 1 --replication-factor 1
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m
    logging: *default-logging

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=\"-Xms64m -Xmx64m\" /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 800M
    mem_limit: 800m
    logging: *default-logging

  redis:
    image: redis:8.10.0
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    mem_limit: 128m
    logging: *default-logging

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      AUTH_DB_USERNAME: "${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}"
      FLAG_DB_USERNAME: "${FLAG_DB_USERNAME:?FLAG_DB_USERNAME is required}"
      FLAG_DB_PASSWORD: "${FLAG_DB_PASSWORD:?FLAG_DB_PASSWORD is required}"
      AUDIT_DB_USERNAME: "${AUDIT_DB_USERNAME:?AUDIT_DB_USERNAME is required}"
      AUDIT_DB_PASSWORD: "${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}"
      ANALYTICS_DB_USERNAME: "${ANALYTICS_DB_USERNAME:?ANALYTICS_DB_USERNAME is required}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}"
      NOTIFICATION_DB_USERNAME: "${NOTIFICATION_DB_USERNAME:?NOTIFICATION_DB_USERNAME is required}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --silent'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 800M
    mem_limit: 800m
    logging: *default-logging

volumes:
  kafka-data:
  mysql-data:
