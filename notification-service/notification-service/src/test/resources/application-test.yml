spring:
  application:
    name: NOTIFICATION-SERVICE-TEST

  datasource:
    url: jdbc:h2:mem:notification_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    listener:
      auto-startup: false

  mail:
    host: localhost
    port: 2525
    username: test-notification-mail
    password: test-notification-mail
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    public-key-location: classpath:test-public-key.pem
    issuer: feature-flag-auth-test
    audience: feature-flag-api-test

NOTIFICATION_INTERNAL_SERVICE_KEY: test-notification-internal-key
AUTH_RECIPIENTS_SERVICE_KEY: test-auth-recipients-key

app:
  notification:
    delivery:
      enabled: false
