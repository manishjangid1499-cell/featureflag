spring:
  application:
    name: AUTH-SERVICE-TEST

  datasource:
    url: jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  bootstrap:
    owner:
      enabled: false

security:
  jwt:
    private-key-location: classpath:test-private-key.pem
    public-key-location: classpath:test-public-key.pem
    issuer: feature-flag-auth-test
    audience: feature-flag-api-test
    access-token-ttl: 15m
    key-id: auth-test-key
