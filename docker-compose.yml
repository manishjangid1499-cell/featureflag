services:

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      AUTH_DB_USERNAME: "${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}"
      FLAG_DB_USERNAME: "${FLAG_DB_USERNAME:?FLAG_DB_USERNAME is required}"
      FLAG_DB_PASSWORD: "${FLAG_DB_PASSWORD:?FLAG_DB_PASSWORD is required}"
      AUDIT_DB_USERNAME: "${AUDIT_DB_USERNAME:?AUDIT_DB_USERNAME is required}"
      AUDIT_DB_PASSWORD: "${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}"
      ANALYTICS_DB_USERNAME: "${ANALYTICS_DB_USERNAME:?ANALYTICS_DB_USERNAME is required}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}"
      NOTIFICATION_DB_USERNAME: "${NOTIFICATION_DB_USERNAME:?NOTIFICATION_DB_USERNAME is required}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --silent'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  redis:
    image: redis:8.10.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events-audit-dlt --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-flag-events-analytics-dlt --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events-dlt --partitions 1 --replication-factor 1

  eureka-server:
    image: eureka-server:latest
    restart: unless-stopped
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  auth-service:
    image: auth-service:latest
    restart: unless-stopped
    build:
      context: ./auth-service/auth-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_DB_USERNAME: "${AUTH_DB_USERNAME:?AUTH_DB_USERNAME is required}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}"
      AUTH_JWT_PRIVATE_KEY_LOCATION: "file:/run/secrets/jwt-private.pem"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-15m}"
      JWT_KEY_ID: "${JWT_KEY_ID:?JWT_KEY_ID is required}"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      NOTIFICATION_INTERNAL_SERVICE_KEY: "${NOTIFICATION_INTERNAL_SERVICE_KEY:?NOTIFICATION_INTERNAL_SERVICE_KEY is required}"
      BOOTSTRAP_OWNER_ENABLED: "${BOOTSTRAP_OWNER_ENABLED:-false}"
      BOOTSTRAP_OWNER_NAME: "${BOOTSTRAP_OWNER_NAME:-}"
      BOOTSTRAP_OWNER_EMAIL: "${BOOTSTRAP_OWNER_EMAIL:-}"
      BOOTSTRAP_OWNER_PASSWORD: "${BOOTSTRAP_OWNER_PASSWORD:-}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"
    volumes:
      - type: bind
        source: "${AUTH_JWT_PRIVATE_KEY_FILE:?AUTH_JWT_PRIVATE_KEY_FILE is required}"
        target: /run/secrets/jwt-private.pem
        read_only: true
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  flag-service:
    image: flag-service:latest
    restart: unless-stopped
    build:
      context: ./flag-service/flag-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLAG_DB_USERNAME: "${FLAG_DB_USERNAME:?FLAG_DB_USERNAME is required}"
      FLAG_DB_PASSWORD: "${FLAG_DB_PASSWORD:?FLAG_DB_PASSWORD is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy

  audit-service:
    image: audit-service:latest
    restart: unless-stopped
    build:
      context: ./audit-service/audit-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUDIT_DB_USERNAME: "${AUDIT_DB_USERNAME:?AUDIT_DB_USERNAME is required}"
      AUDIT_DB_PASSWORD: "${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy

  analytics-service:
    image: analytics-service:latest
    restart: unless-stopped
    build:
      context: ./analytics-service/analytics-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANALYTICS_DB_USERNAME: "${ANALYTICS_DB_USERNAME:?ANALYTICS_DB_USERNAME is required}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy

  api-gateway:
    image: api-gateway:latest
    restart: unless-stopped
    build:
      context: ./api-gateway/api-gateway
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      auth-service:
        condition: service_started
      flag-service:
        condition: service_started
      eureka-server:
        condition: service_healthy

  notification-service:
    image: notification-service:latest
    restart: unless-stopped
    build:
      context: ./notification-service/notification-service
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NOTIFICATION_DB_USERNAME: "${NOTIFICATION_DB_USERNAME:?NOTIFICATION_DB_USERNAME is required}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}"
      NOTIFICATION_MAIL_USERNAME: "${NOTIFICATION_MAIL_USERNAME:?NOTIFICATION_MAIL_USERNAME is required}"
      NOTIFICATION_MAIL_PASSWORD: "${NOTIFICATION_MAIL_PASSWORD:?NOTIFICATION_MAIL_PASSWORD is required}"
      NOTIFICATION_MAIL_CONNECTION_TIMEOUT_MS: "${NOTIFICATION_MAIL_CONNECTION_TIMEOUT_MS:-10000}"
      NOTIFICATION_MAIL_READ_TIMEOUT_MS: "${NOTIFICATION_MAIL_READ_TIMEOUT_MS:-10000}"
      NOTIFICATION_MAIL_WRITE_TIMEOUT_MS: "${NOTIFICATION_MAIL_WRITE_TIMEOUT_MS:-10000}"
      AUTH_RECIPIENTS_SERVICE_KEY: "${AUTH_RECIPIENTS_SERVICE_KEY:?AUTH_RECIPIENTS_SERVICE_KEY is required}"
      NOTIFICATION_INTERNAL_SERVICE_KEY: "${NOTIFICATION_INTERNAL_SERVICE_KEY:?NOTIFICATION_INTERNAL_SERVICE_KEY is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
    volumes:
      - type: bind
        source: "${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE is required}"
        target: /run/secrets/jwt-public.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy

  frontend:
    image: feature-flag-frontend:latest
    restart: unless-stopped
    build:
      context: ./Frontend/feature-flag-ui
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "-T", "4", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  kafka-data:
  mysql-data:
