server:
  port: 8084

spring:
  application:
    name: AUDIT-SERVICE

  datasource:
    url: jdbc:mysql://mysql:3306/audit_db
    username: ${AUDIT_DB_USERNAME}
    password: ${AUDIT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: kafka:29092

    consumer:
      auto-offset-reset: earliest

      properties:
        spring.json.trusted.packages: com.featureflag.audit_service.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.featureflag.audit_service.event.FlagEvent

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
