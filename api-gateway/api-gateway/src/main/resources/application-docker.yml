server:
  port: 8080

spring:
  application:
    name: GATEWAY-SERVICE

  cloud:
    gateway:
      server:
        webflux:

          # ==========================================
          # GLOBAL CORS CONFIGURATION
          # ==========================================
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "*"
                allowCredentials: false
                maxAge: 3600

          # ==========================================
          # ROUTES
          # ==========================================
          routes:

            # ==========================================
            # OPENAPI SPECIFICATION ROUTES (ORDER: -1)
            # ==========================================

            - id: auth-service-openapi
              uri: lb://AUTH-SERVICE
              order: -1
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - RewritePath=/auth/v3/api-docs, /v3/api-docs

            - id: flag-service-openapi
              uri: lb://FLAG-SERVICE
              order: -1
              predicates:
                - Path=/flags/v3/api-docs
              filters:
                - RewritePath=/flags/v3/api-docs, /v3/api-docs

            - id: analytics-service-openapi
              uri: lb://ANALYTICS-SERVICE
              order: -1
              predicates:
                - Path=/analytics/v3/api-docs
              filters:
                - RewritePath=/analytics/v3/api-docs, /v3/api-docs

            - id: notification-service-openapi
              uri: lb://NOTIFICATION-SERVICE
              order: -1
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - RewritePath=/notification/v3/api-docs, /v3/api-docs

            - id: audit-service-openapi
              uri: lb://AUDIT-SERVICE
              order: -1
              predicates:
                - Path=/audit/v3/api-docs
              filters:
                - RewritePath=/audit/v3/api-docs, /v3/api-docs


            # ==========================================
            # APPLICATION BUSINESS ROUTES
            # ==========================================

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**, /members/**

            - id: flag-service
              uri: lb://FLAG-SERVICE
              predicates:
                - Path=/flags/**

            - id: analytics-service
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/analytics/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/audit/**


eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState"


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

    urls:
      - name: Auth Service
        url: /auth/v3/api-docs

      - name: Flag Service
        url: /flags/v3/api-docs

      - name: Analytics Service
        url: /analytics/v3/api-docs

      - name: Notification Service
        url: /notification/v3/api-docs

      - name: Audit Service
        url: /audit/v3/api-docs
