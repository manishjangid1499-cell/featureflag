server:
  port: 8085

spring:
  application:
    name: ANALYTICS-SERVICE

  datasource:
    url: jdbc:mysql://mysql:3306/analytics_db
    username: ${ANALYTICS_DB_USERNAME}
    password: ${ANALYTICS_DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: kafka:29092

    consumer:
      auto-offset-reset: earliest

      properties:
        spring.json.trusted.packages: com.featureflag.analytics_service.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.featureflag.analytics_service.event.FlagEvent

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

clients:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    service-key: ${AUTH_INTERNAL_SERVICE_KEY:${AUTH_RECIPIENTS_SERVICE_KEY:}}
    connect-timeout-ms: ${AUTH_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AUTH_SERVICE_READ_TIMEOUT_MS:3000}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
